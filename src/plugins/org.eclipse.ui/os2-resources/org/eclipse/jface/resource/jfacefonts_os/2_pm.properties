# JFace 2.0.1 looks up jfacefonts_<os.name>_<SWT platform>.
# The IBM JVM reports OS/2, so the slash becomes part of the resource path.
# Omit dialogfont, bannerfont and headerfont so FontRegistry uses
# Display.getSystemFont() for dialog content and headings.
# Keep the generic definitions for the other registry entries.
org.eclipse.jface.defaultfont.0=MS Sans Serif-regular-8
org.eclipse.jface.defaultfont.1=b&h-lucidabright-regular-8
org.eclipse.jface.viewerfont.0=MS Sans Serif-regular-8
org.eclipse.jface.viewerfont.1=b&h-lucidabright-regular-8
org.eclipse.jface.textfont.0=Courier-regular-8
org.eclipse.jface.textfont.1=b&h-lucidabright-regular-8
